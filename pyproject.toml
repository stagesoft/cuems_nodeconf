[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cuemsnodeconf"
version = "0.1.0"
description = "CUEMS Node Configuration - Node configuration and network management for CUEMS system"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0"
keywords = ["cuems", "node", "configuration", "network"]
authors = [
    { name = "CUEMS Team", email = "ion@stagelab.coop" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: System :: Networking",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "cuemsutils>=0.1.0rc4",
    "netifaces",
    "zeroconf",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/cuems/cuems-nodeconf"
Documentation = "https://github.com/cuems/cuems-nodeconf#readme"
Repository = "https://github.com/cuems/cuems-nodeconf"

[project.scripts]
cuems-nodeconf = "cuemsnodeconf.run_nodeconf:main"

[tool.hatch.build.targets.wheel]
packages = ["cuemsnodeconf"]

[tool.hatch.build.targets.wheel.shared-data]
"cuemsnodeconf/network_map.xsd" = "network_map.xsd"

